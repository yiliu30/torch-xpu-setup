title: torch-xpu-setup
description: Validated setup notes and helper scripts for PyTorch XPU on Intel Battlemage.
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# Render every markdown page with the theme layout and a table of
# contents of its headings automatically, so new docs need no front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      has_toc: true
