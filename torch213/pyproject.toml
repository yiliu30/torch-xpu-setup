[project]
name = "torch-xpu-test-213"
version = "0.1.0"
description = "PyTorch XPU 2.13 test environment for Intel BMG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
    "torchaudio>=2.11,<2.12",
]

[tool.uv.sources]
torch = [{ index = "pytorch-xpu" }]
torchvision = [{ index = "pytorch-xpu" }]
torchaudio = [{ index = "pytorch-xpu" }]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
